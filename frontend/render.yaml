services:
  - type: web
    name: email-agent-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: GOOGLE_GEMINI_API_KEY
        sync: false # You will enter this in the Render Dashboard manually
